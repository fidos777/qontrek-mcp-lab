version: "1.0"

quality_checks:
  - name: "completeness"
    check: "all 9 slides present"
    weight: 0.4
  
  - name: "coherence"
    check: "slides tell cohesive story"
    weight: 0.3
  
  - name: "persuasiveness"
    check: "content is compelling for investors"
    weight: 0.3

rewrite_triggers:
  - condition: "quality_score < 0.7"
    action: "regenerate weak slides"
    max_attempts: 2
  
  - condition: "forbidden_pattern_found"
    action: "remove pattern and regenerate"

error_recovery:
  - error: "missing_slide"
    action: "generate placeholder slide"
  
  - error: "generation_failed"
    action: "return partial deck with errors"
